version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: django_postgres
    restart: always
    environment:
      POSTGRES_DB: local_django_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres_user -d local_django_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    ports:
      - "6379:6379"  # Проброс порта для локального подключения Django к Redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
