services:
  db:
    image: postgres:16-alpine
    container_name: django_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-freelance_crm}
      POSTGRES_USER: ${POSTGRES_USER:-freelance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-freelance_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freelance -d freelance_crm"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: django_redis
    restart: always
    ports:
      - "6379:6379"  # Проброс порта для локального подключения Django к Redis
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
